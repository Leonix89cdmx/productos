spring.application.name=productos
server.port=${PORT:8081}

# --- PostgreSQL (contenedor kt-postgres) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/products_db}
spring.datasource.username=${DB_USER:kafka_user}
spring.datasource.password=${DB_PASSWORD:kafka_pass}

# --- JPA ---
# validate: Hibernate NO crea tablas, solo verifica que coincidan (las crea Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Actuator (para las probes de K8s) ---
management.endpoint.health.probes.enabled=true

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Confiabilidad: el broker confirma solo cuando el mensaje está escrito; sin duplicados por reintentos
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# No mandar el nombre de la clase Java en headers (otros servicios tienen otros paquetes)
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topics.product-events=product-events
