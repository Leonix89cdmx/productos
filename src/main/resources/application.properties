spring.application.name=productos
server.port=${PORT:8081}

# --- PostgreSQL (contenedor kt-postgres) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/products_db}
spring.datasource.username=${DB_USER:kafka_user}
spring.datasource.password=${DB_PASSWORD:kafka_pass}

# --- JPA ---
# validate: Hibernate NO crea tablas, solo verifica que coincidan (las crea Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Actuator (para las probes de K8s) ---
management.endpoint.health.probes.enabled=true
