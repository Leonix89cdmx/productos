apiVersion: v1
kind: Namespace
metadata:
  name: productos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos
  namespace: productos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productos
  template:
    metadata:
      labels:
        app: productos
    spec:
      containers:
        - name: productos
          image: productos:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: productos
  namespace: productos
spec:
  selector:
    app: productos
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: productos
  namespace: productos
spec:
  ingressClassName: nginx
  rules:
    - host: productos.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: productos
                port:
                  number: 80
